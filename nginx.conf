server {
    listen 80;
    listen [::]:80;
    server_name stdom.be www.stdom.be;

    # Redirect HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stdom.be www.stdom.be;

    # SSL — à configurer avec Let's Encrypt (certbot)
    ssl_certificate     /etc/letsencrypt/live/stdom.be/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stdom.be/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Redirect www → non-www
    if ($host = www.stdom.be) {
        return 301 https://stdom.be$request_uri;
    }

    root /var/www/stdom/dist;
    index index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Static assets — long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # HTML — no cache (so updates are picked up)
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # SPA-style fallback for Astro static output
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Custom 404
    error_page 404 /404.html;
}
